name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile contracts
        run: npm run compile
      - name: Contract and setup tests
        run: npm test
      - name: UI integration test
        run: npm run test:ui
      - name: Production web build
        run: npm run build
